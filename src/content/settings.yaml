# Owner inputs. Every `null` is a value Zaria Capital has not supplied.
# Nothing is shown for a null value: the sentence, row or section that needs it is
# left out, and the Regulatory information page appears only once an entity's
# details or regulatory sentence is filled in.

site:
  # General contact address. Shown in the footer and in the JSON-LD.
  email: info@zariacapital.es

  entities:
    spain:
      legalName: null # full registered name, e.g. "Zaria Capital, S.L."
      taxId: null # NIF/CIF
      registry: # Registro Mercantil details (tomo, folio, hoja, inscripción), in each language
        en: null
        es: null
      registeredAddress: null
      # One sentence on its regulatory status in Spain, approved by counsel. If it is not
      # CNMV-registered, say what it is (e.g. "is not authorised or registered with the CNMV").
      regulatoryStatement:
        en: null
        es: null
    adgm:
      legalName: null
      registrationNumber: null
      address: null
      # One sentence: whether it is authorised by the ADGM FSRA and for which activities, or what it is if not.
      regulatoryStatement:
        en: null
        es: null
