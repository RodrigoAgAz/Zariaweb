title: Zaria Capital | Independent advice and investment
description: Zaria Capital is an independent advisory and investment firm working across Southern Europe and Latin America, the Middle East and the United States.
h1: Independent advice and investment across Southern Europe and Latin America, the Middle East and the United States.
lead: We work directly with principals and institutions on transactions and partnerships where the outcome depends on trust, access, structuring and execution on the ground.

lines:
  heading: What we do
  items:
    - name: Strategic Advisory
      anchor: strategic-advisory
      text: Cross-border M&A, strategic partnerships and market entry.
    - name: Financing Solutions
      anchor: financing-solutions
      text: Capital formation and structured financing across equity, debt and hybrid instruments, for corporates, infrastructure and sovereign-linked issuers.
    - name: Principal Investing
      anchor: principal-investing
      text: Joint ventures and co-investments in Spain and Abu Dhabi, with operational involvement from day one.

