sections:
  - heading: Titular del sitio web
    paragraphs:
      - Este sitio web es propiedad de Zaria Capital, que lo gestiona. Puede ponerse en contacto con nosotros en {email}.
      - "{spainName} facilita los datos siguientes en cumplimiento del artículo 10 de la Ley 34/2002, de 11 de julio, de servicios de la sociedad de la información y de comercio electrónico (LSSI-CE)."
    details:
