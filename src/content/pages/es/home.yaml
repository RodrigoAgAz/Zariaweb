services:
  label: Qué hacemos
  statement: Zaria Capital es una firma independiente de asesoramiento e inversión que trabaja junto a empresas, familias e instituciones en *situaciones transfronterizas complejas.*
  items:
    - title: Asesoramiento estratégico
      text: Asesoramiento en situaciones transfronterizas complejas para empresas, familias e instituciones, buena parte de él surgido de relaciones construidas durante décadas.
      caps: [Fusiones y adquisiciones transfronterizas, Alianzas estratégicas, Entrada en nuevos mercados]
    - title: Financiación
      text: Captación y estructuración de capital para operaciones transfronterizas, apoyada en relaciones en los tres corredores de la firma.
      caps: [Captación de capital, Financiación estructurada]
    - title: Inversión como principal
      text: Zaria Capital invierte como principal mediante joint ventures y coinversiones en España y Abu Dabi, con implicación operativa desde el primer día.
      caps: [Joint ventures, Coinversiones, Implicación operativa]

