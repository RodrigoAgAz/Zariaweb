photoAlt: Vista aérea del centro de Madrid en blanco y negro, a lo largo de la Gran Vía y el edificio Metrópolis con su cúpula.

firm:
  heading: La firma
  paragraphs:
    - Zaria Capital asesora e invierte junto a empresas, familias e inversores en situaciones transfronterizas, cuando el resultado depende de la confianza, el acceso, la estructuración y la ejecución sobre el terreno.
    - Asesoramos en fusiones y adquisiciones transfronterizas, alianzas estratégicas y entrada en nuevos mercados, así como en captación de capital y financiación estructurada.
    - También invertimos como principal, mediante joint ventures y coinversiones en España y Abu Dabi, con implicación operativa desde el primer día.

