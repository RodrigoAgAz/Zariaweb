title: Zaria Capital | Asesoramiento e inversión independientes
description: Zaria Capital es una firma independiente de asesoramiento e inversión que trabaja en el sur de Europa y Latinoamérica, Oriente Medio y Estados Unidos.
h1: Asesoramiento e inversión independientes en el sur de Europa y Latinoamérica, Oriente Medio y Estados Unidos.
lead: Trabajamos directamente con empresarios e instituciones en operaciones y alianzas cuyo resultado depende de la confianza, el acceso, la estructuración y la ejecución sobre el terreno.

lines:
  heading: Qué hacemos
  items:
    - name: Asesoramiento estratégico
      anchor: strategic-advisory
      text: Fusiones y adquisiciones transfronterizas, alianzas estratégicas y entrada en nuevos mercados.
    - name: Soluciones de financiación
      anchor: financing-solutions
      text: Captación de capital y financiación estructurada con instrumentos de capital, deuda e híbridos, para empresas, infraestructuras y emisores vinculados a Estados.
    - name: Inversión directa
      anchor: principal-investing
      text: Joint ventures y coinversiones en España y Abu Dabi, con implicación operativa desde el primer día.

corridors:
  heading: Dónde trabajamos
