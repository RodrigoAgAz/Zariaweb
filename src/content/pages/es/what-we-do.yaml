title: Qué hacemos | Zaria Capital
description: Asesoramiento estratégico, soluciones de financiación e inversión directa en el sur de Europa y Latinoamérica, Oriente Medio y Estados Unidos.
h1: Qué hacemos
lead: Zaria Capital trabaja en tres líneas de negocio.

lines:
  - name: Asesoramiento estratégico
    anchor: strategic-advisory
    paragraphs:
      - Asesoramos en fusiones y adquisiciones transfronterizas, alianzas estratégicas y entrada en nuevos mercados.
      - Trabajamos directamente con empresarios, familias, empresas, inversores e instituciones vinculadas a Estados en el sur de Europa y Latinoamérica, Oriente Medio y Estados Unidos.
  - name: Soluciones de financiación
    anchor: financing-solutions
    paragraphs:
      - Trabajamos en captación de capital y financiación estructurada con instrumentos de capital, deuda e híbridos.
      - Nuestro trabajo de financiación se dirige a empresas, infraestructuras y emisores vinculados a Estados.
  - name: Inversión directa
    anchor: principal-investing
    paragraphs:
      - Invertimos como principal mediante joint ventures y coinversiones en España y Abu Dabi.
      - Nos implicamos en la gestión de cada inversión desde el primer día.

notice: Nada de lo contenido en este sitio web constituye una oferta o solicitud de compra o venta de valores o productos financieros.
